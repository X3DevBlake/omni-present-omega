<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="qubit-nucleus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#00F2FE" />
      <stop offset="80%" stop-color="#7B61FF" />
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="orbital-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#F06292" />
    </linearGradient>
    <filter id="qubit-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Bloch Sphere Ambient Outer Sphere -->
  <circle cx="32" cy="32" r="26" stroke="#4E82EE" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Equator & Longitudinal Rings -->
  <ellipse cx="32" cy="32" rx="26" ry="10" stroke="#7B61FF" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6" />
  <ellipse cx="32" cy="32" rx="10" ry="26" stroke="#7B61FF" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6" />

  <!-- Orbiting Superposition Probability Rings -->
  <ellipse cx="32" cy="32" rx="25" ry="9" stroke="url(#orbital-grad)" stroke-width="2.5" transform="rotate(-35 32 32)" filter="url(#qubit-glow)" />
  <ellipse cx="32" cy="32" rx="25" ry="9" stroke="url(#orbital-grad)" stroke-width="2.5" transform="rotate(35 32 32)" filter="url(#qubit-glow)" />

  <!-- State Vector Arrow |ψ> -->
  <line x1="32" y1="32" x2="44" y2="14" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" />
  <polygon points="43,12 48,15 45,20" fill="#00F2FE" />

  <!-- Computational Basis Poles: |0> at North, |1> at South -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.7" />
  <circle cx="32" cy="6" r="3" fill="#00F2FE" />
  <circle cx="32" cy="58" r="3" fill="#F06292" />

  <!-- Central Superconducting / Neutral Atom Qubit Core -->
  <circle cx="32" cy="32" r="10" fill="url(#qubit-nucleus)" opacity="0.5" />
  <circle cx="32" cy="32" r="4.5" fill="#FFFFFF" filter="url(#qubit-glow)" />
</svg>