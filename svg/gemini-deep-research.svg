<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gemini-sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E82EE" />
      <stop offset="40%" stop-color="#7B61FF" />
      <stop offset="80%" stop-color="#F06292" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <radialGradient id="research-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>
    <filter id="research-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="26" fill="url(#research-glow)" opacity="0.4" />

  <!-- Outer Research Aperture / Compass Ring -->
  <circle cx="32" cy="32" r="24" stroke="url(#gemini-sparkle-grad)" stroke-width="2" stroke-dasharray="8 4" opacity="0.8" />
  <circle cx="32" cy="32" r="17" stroke="#00F2FE" stroke-width="1.5" opacity="0.6" />

  <!-- Crosshair Reticles -->
  <line x1="6" y1="32" x2="16" y2="32" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" />
  <line x1="48" y1="32" x2="58" y2="32" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="6" x2="32" y2="16" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="48" x2="32" y2="58" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" />

  <!-- Central Gemini Deep Sparkle Core -->
  <path d="M32 18 C32 25.7 25.7 32 18 32 C25.7 32 32 38.3 32 46 C32 38.3 38.3 32 46 32 C38.3 32 32 25.7 32 18 Z" 
        fill="url(#gemini-sparkle-grad)" filter="url(#research-blur)" />

  <!-- Central Superposition Core Point -->
  <circle cx="32" cy="32" r="3" fill="#FFFFFF" />

  <!-- Miniature Satellite Sparkle -->
  <circle cx="45" cy="19" r="2" fill="#F06292" />
  <circle cx="19" cy="45" r="2" fill="#00F2FE" />
</svg>