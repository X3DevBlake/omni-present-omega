<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Outer Rim Metallic Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="75%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Cyan Laser Glow Gradient -->
    <linearGradient id="cyanLaser" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Obsidian Core Radial -->
    <radialGradient id="obsidianCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="65%" stop-color="#050811" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Holographic Shimmer -->
    <linearGradient id="holoShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.6)" />
      <stop offset="30%" stop-color="rgba(236, 72, 153, 0.4)" />
      <stop offset="70%" stop-color="rgba(234, 179, 8, 0.5)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.6)" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="hologramGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Outer Halo -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#cyanLaser)" stroke-width="3" opacity="0.4" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#goldRim)" stroke-width="1.5" opacity="0.6" />

  <!-- Coin Heavy Outer Rim -->
  <circle cx="256" cy="256" r="216" fill="url(#goldRim)" filter="url(#hologramGlow)" />
  <circle cx="256" cy="256" r="206" fill="#080c14" />
  <circle cx="256" cy="256" r="200" fill="url(#obsidianCore)" />

  <!-- Inner Holographic Ring Lattices -->
  <circle cx="256" cy="256" r="182" fill="none" stroke="url(#cyanLaser)" stroke-width="2" opacity="0.5" stroke-dasharray="4 6" />
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#holoShimmer)" stroke-width="1" opacity="0.7" />

  <!-- Circled Starlight Nodes -->
  <g opacity="0.8">
    <circle cx="256" cy="56" r="4" fill="#38bdf8" />
    <circle cx="456" cy="256" r="4" fill="#38bdf8" />
    <circle cx="256" cy="456" r="4" fill="#38bdf8" />
    <circle cx="56" cy="256" r="4" fill="#38bdf8" />
    <circle cx="397" cy="115" r="3" fill="#eab308" />
    <circle cx="397" cy="397" r="3" fill="#eab308" />
    <circle cx="115" cy="397" r="3" fill="#eab308" />
    <circle cx="115" cy="115" r="3" fill="#eab308" />
  </g>

  <!-- Core Emblem: Interwoven Biometric Iris & Sovereign Humanity Symbol -->
  <!-- Radiating Iris Rays -->
  <g stroke="url(#cyanLaser)" stroke-width="1.5" opacity="0.35">
    <line x1="256" y1="120" x2="256" y2="150" />
    <line x1="256" y1="362" x2="256" y2="392" />
    <line x1="120" y1="256" x2="150" y2="256" />
    <line x1="362" y1="256" x2="392" y2="256" />
    <line x1="160" y1="160" x2="182" y2="182" />
    <line x1="330" y1="330" x2="352" y2="352" />
    <line x1="160" y1="352" x2="182" y2="330" />
    <line x1="330" y1="182" x2="352" y2="160" />
  </g>

  <!-- Stylized DNA Helix & Biometric Eye Outline -->
  <path d="M 146 256 Q 256 160 366 256 Q 256 352 146 256 Z" fill="none" stroke="url(#cyanLaser)" stroke-width="4" filter="url(#hologramGlow)" />
  <path d="M 176 256 Q 256 190 336 256 Q 256 322 176 256 Z" fill="none" stroke="url(#goldRim)" stroke-width="2.5" opacity="0.8" />

  <!-- Outstretched Sovereign Hands / Human Wings Motif -->
  <path d="M 180 290 C 200 240, 230 210, 256 210 C 282 210, 312 240, 332 290 C 310 270, 280 260, 256 260 C 232 260, 202 270, 180 290 Z" fill="url(#holoShimmer)" opacity="0.75" />

  <!-- Central Iris Core with Humanity 'H' Micro-Lattice -->
  <circle cx="256" cy="256" r="46" fill="url(#obsidianCore)" stroke="url(#goldRim)" stroke-width="3" />
  <circle cx="256" cy="256" r="32" fill="none" stroke="url(#cyanLaser)" stroke-width="2" />
  <circle cx="256" cy="256" r="16" fill="url(#cyanLaser)" opacity="0.85" />
  <circle cx="256" cy="256" r="7" fill="#ffffff" />

  <!-- Monogram Letter H for Humanity -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.95">
    <line x1="240" y1="236" x2="240" y2="276" />
    <line x1="272" y1="236" x2="272" y2="276" />
    <line x1="240" y1="256" x2="272" y2="256" />
  </g>

  <!-- Typography Arc: "HUMANITY • SOVEREIGN PROOF" -->
  <path id="textArcTop" d="M 100 256 A 156 156 0 0 1 412 256" fill="none" />
  <text font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#fde047" letter-spacing="9">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">HUMANITY TOKEN</textPath>
  </text>

  <!-- Typography Arc: "10 BILLION SUPPLY • PROOF OF HUMANITY" -->
  <path id="textArcBottom" d="M 412 256 A 156 156 0 0 1 100 256" fill="none" />
  <text font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="6">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">10B SUPPLY • FREE TO MINE</textPath>
  </text>
</svg>
