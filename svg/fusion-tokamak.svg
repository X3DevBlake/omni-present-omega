<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="plasma-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FF5252" />
      <stop offset="70%" stop-color="#FF1744" />
      <stop offset="100%" stop-color="#7B1FA2" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tokamak-coil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4E82EE" />
      <stop offset="100%" stop-color="#7B61FF" />
    </linearGradient>
    <filter id="plasma-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Superconducting Outer Vacuum Vessel -->
  <circle cx="32" cy="32" r="26" stroke="url(#tokamak-coil)" stroke-width="2.5" opacity="0.85" />
  <circle cx="32" cy="32" r="21" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6" />

  <!-- D-Shaped Toroidal Field (TF) Coils -->
  <path d="M32 8 C44 8 50 18 50 32 C50 46 44 56 32 56" stroke="url(#tokamak-coil)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M32 8 C20 8 14 18 14 32 C14 46 20 56 32 56" stroke="url(#tokamak-coil)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
  
  <!-- Central Solenoid Assembly -->
  <rect x="29" y="10" width="6" height="44" rx="2" fill="#0E172A" stroke="#00F2FE" stroke-width="2" />
  <line x1="29" y1="22" x2="35" y2="22" stroke="#00F2FE" stroke-width="1.5" />
  <line x1="29" y1="32" x2="35" y2="32" stroke="#00F2FE" stroke-width="1.5" />
  <line x1="29" y1="42" x2="35" y2="42" stroke="#00F2FE" stroke-width="1.5" />

  <!-- Toroidal Plasma Ring with Extreme Fusion Heat Glow -->
  <ellipse cx="32" cy="32" rx="14" ry="7" fill="none" stroke="url(#plasma-core)" stroke-width="6" opacity="0.8" filter="url(#plasma-glow)" />
  <ellipse cx="32" cy="32" rx="14" ry="7" fill="none" stroke="#FFF" stroke-width="1.5" opacity="0.9" />

  <!-- High-Energy Neutrons Emitted Outward -->
  <circle cx="20" cy="20" r="1.5" fill="#FFE57F" />
  <circle cx="44" cy="44" r="1.5" fill="#FFE57F" />
  <circle cx="44" cy="20" r="1.5" fill="#FFE57F" />
  <circle cx="20" cy="44" r="1.5" fill="#FFE57F" />
</svg>