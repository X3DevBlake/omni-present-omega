<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="crdt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4E82EE" />
      <stop offset="100%" stop-color="#7B61FF" />
    </linearGradient>
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>
    <filter id="crdt-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background lattice links -->
  <line x1="32" y1="10" x2="12" y2="32" stroke="url(#crdt-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <line x1="32" y1="10" x2="52" y2="32" stroke="url(#crdt-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <line x1="12" y1="32" x2="32" y2="54" stroke="url(#crdt-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <line x1="52" y1="32" x2="32" y2="54" stroke="url(#crdt-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <line x1="12" y1="32" x2="52" y2="32" stroke="#7B61FF" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Central Join Operator (⊔) Symbol -->
  <path d="M27 27 L27 34 C27 37 37 37 37 34 L37 27" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Lattice Nodes with Glowing Rings -->
  <!-- Top: Supremum / Join Root -->
  <circle cx="32" cy="10" r="8" fill="url(#node-glow)" opacity="0.5" />
  <circle cx="32" cy="10" r="4.5" fill="#00F2FE" filter="url(#crdt-filter)" />
  <circle cx="32" cy="10" r="2" fill="#FFFFFF" />

  <!-- Left: Replica A -->
  <circle cx="12" cy="32" r="7" fill="url(#node-glow)" opacity="0.4" />
  <circle cx="12" cy="32" r="4" fill="#4E82EE" filter="url(#crdt-filter)" />
  <circle cx="12" cy="32" r="1.8" fill="#FFFFFF" />

  <!-- Right: Replica B -->
  <circle cx="52" cy="32" r="7" fill="url(#node-glow)" opacity="0.4" />
  <circle cx="52" cy="32" r="4" fill="#7B61FF" filter="url(#crdt-filter)" />
  <circle cx="52" cy="32" r="1.8" fill="#FFFFFF" />

  <!-- Bottom: Infimum / Base State -->
  <circle cx="32" cy="54" r="7" fill="url(#node-glow)" opacity="0.3" />
  <circle cx="32" cy="54" r="4" fill="#38BDF8" filter="url(#crdt-filter)" />
  <circle cx="32" cy="54" r="1.8" fill="#FFFFFF" />
</svg>