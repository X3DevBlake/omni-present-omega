<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="radar-chassis-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <radialGradient id="radar-sweep-beam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#7B61FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Bezel & Azimuth Ticks -->
  <circle cx="32" cy="32" r="30" stroke="url(#radar-chassis-grad)" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3 4"/>
  <circle cx="32" cy="32" r="28" stroke="#00E5FF" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Range Rings -->
  <circle cx="32" cy="32" r="22" stroke="#00F2FE" stroke-width="1.2" stroke-opacity="0.6"/>
  <circle cx="32" cy="32" r="14" stroke="#00F2FE" stroke-width="1.2" stroke-opacity="0.7"/>
  <circle cx="32" cy="32" r="6" stroke="#00F2FE" stroke-width="1.2" stroke-opacity="0.9"/>

  <!-- Crosshairs -->
  <line x1="32" y1="2" x2="32" y2="62" stroke="#00F2FE" stroke-width="0.9" stroke-opacity="0.4"/>
  <line x1="2" y1="32" x2="62" y2="32" stroke="#00F2FE" stroke-width="0.9" stroke-opacity="0.4"/>
  <line x1="11" y1="11" x2="53" y2="53" stroke="#7B61FF" stroke-width="0.6" stroke-dasharray="2 2" stroke-opacity="0.3"/>
  <line x1="11" y1="53" x2="53" y2="11" stroke="#7B61FF" stroke-width="0.6" stroke-dasharray="2 2" stroke-opacity="0.3"/>

  <!-- 90-Degree Radar Phosphor Sweep Wedge -->
  <path d="M 32 32 L 53 11 A 30 30 0 0 1 62 32 Z" fill="url(#radar-sweep-beam)" opacity="0.6"/>

  <!-- Multi-Spectral Anomaly Targets -->
  <!-- Target Alpha (LEO Orbital Target - Cyan) -->
  <circle cx="44" cy="18" r="2.8" fill="#00F2FE"/>
  <circle cx="44" cy="18" r="5.5" stroke="#00F2FE" stroke-width="0.8" stroke-opacity="0.6"/>

  <!-- Target Bravo (Hypersonic Signature - Red) -->
  <circle cx="20" cy="42" r="2.5" fill="#EF4444"/>
  <circle cx="20" cy="42" r="5" stroke="#EF4444" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Target Charlie (Subsea SCION Fiber Anchor - Emerald) -->
  <circle cx="38" cy="46" r="2" fill="#10B981"/>

  <!-- Target Delta (UAP Vector - Amber) -->
  <circle cx="16" cy="22" r="2.2" fill="#F59E0B"/>

  <!-- Central Scope Emitter Origin -->
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF"/>
</svg>
