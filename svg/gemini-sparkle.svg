<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Facet Gradients for 3D Bevels -->
    <linearGradient id="sparkle-facet-nw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4E82EE"/>
    </linearGradient>
    <linearGradient id="sparkle-facet-ne" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E82EE"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <linearGradient id="sparkle-facet-sw" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <linearGradient id="sparkle-facet-se" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="sparkle-core-orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#00F2FE"/>
      <stop offset="80%" stop-color="#7B61FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#sparkle-core-orb)" opacity="0.35"/>

  <!-- Orbital Dust Ring -->
  <ellipse cx="32" cy="32" rx="30" ry="10" stroke="#00F2FE" stroke-width="0.8" stroke-dasharray="2 4" stroke-opacity="0.4" transform="rotate(-30 32 32)"/>

  <!-- 3D Multifaceted Gemini Star Wings -->
  <!-- North-West Wing (Top-Left Quad) -->
  <path d="M 32 2 C 32 18.57 18.57 32 2 32 L 32 32 Z" fill="url(#sparkle-facet-nw)"/>
  <!-- North-East Wing (Top-Right Quad) -->
  <path d="M 32 2 C 32 18.57 45.43 32 62 32 L 32 32 Z" fill="url(#sparkle-facet-ne)"/>
  <!-- South-West Wing (Bottom-Left Quad) -->
  <path d="M 2 32 C 18.57 32 32 45.43 32 62 L 32 32 Z" fill="url(#sparkle-facet-sw)"/>
  <!-- South-East Wing (Bottom-Right Quad) -->
  <path d="M 62 32 C 45.43 32 32 45.43 32 62 L 32 32 Z" fill="url(#sparkle-facet-se)"/>

  <!-- Specular Center Star Core -->
  <polygon points="32,18 35,29 46,32 35,35 32,46 29,35 18,32 29,29" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="32" cy="32" r="3.2" fill="#FFFFFF"/>
</svg>