<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="docs-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="50%" stop-color="#2B6CB0" />
      <stop offset="100%" stop-color="#1A365D" />
    </linearGradient>
    <linearGradient id="docs-corner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A0C3FF" />
      <stop offset="100%" stop-color="#4285F4" />
    </linearGradient>
    <filter id="docs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Document base with folded corner -->
  <path d="M16 8 H38 L48 18 V56 H16 Z" fill="url(#docs-grad)" rx="3" filter="url(#docs-glow)" />
  <path d="M38 8 V18 H48 Z" fill="url(#docs-corner)" opacity="0.9" />

  <!-- Text lines -->
  <line x1="22" y1="26" x2="42" y2="26" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="22" y1="33" x2="42" y2="33" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <line x1="22" y1="40" x2="36" y2="40" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <line x1="22" y1="47" x2="30" y2="47" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
</svg>
