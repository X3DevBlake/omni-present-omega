  <line x1="20" y1="48" x2="44" y2="48" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Prime Editing Scissors / Guided Nanoparticle Sparkle Target -->
