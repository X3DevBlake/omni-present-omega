  <line x1="26" y1="24" x2="38" y2="24" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" />
  <line x1="20" y1="32" x2="44" y2="32" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
