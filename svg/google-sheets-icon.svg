<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sheets-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F9D58" />
      <stop offset="50%" stop-color="#0B8043" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="sheets-corner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CE0B0" />
      <stop offset="100%" stop-color="#0F9D58" />
    </linearGradient>
    <filter id="sheets-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sheet base with folded corner -->
  <path d="M16 8 H38 L48 18 V56 H16 Z" fill="url(#sheets-grad)" rx="3" filter="url(#sheets-glow)" />
  <path d="M38 8 V18 H48 Z" fill="url(#sheets-corner)" opacity="0.9" />

  <!-- Spreadsheet Grid & Table -->
  <rect x="22" y="25" width="20" height="23" rx="2" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="1.5" />
  <line x1="22" y1="32.5" x2="42" y2="32.5" stroke="#FFFFFF" stroke-width="1.5" />
  <line x1="22" y1="40.5" x2="42" y2="40.5" stroke="#FFFFFF" stroke-width="1.5" />
  <line x1="31" y1="25" x2="31" y2="48" stroke="#FFFFFF" stroke-width="1.5" />
</svg>
