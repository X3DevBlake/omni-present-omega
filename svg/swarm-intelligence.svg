<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="swarm-hive-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <radialGradient id="swarm-queen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FF5E62"/>
      <stop offset="80%" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Outer Orbit -->
  <circle cx="32" cy="32" r="30" stroke="#A855F7" stroke-width="0.8" stroke-dasharray="2 4" stroke-opacity="0.35"/>

  <!-- Outer Pentagon Mesh Ring -->
  <polygon points="32,8 54,23 46,48 18,48 10,23" fill="none" stroke="url(#swarm-hive-grad)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Inner Hex Hive Geometric Links -->
  <line x1="32" y1="32" x2="32" y2="8" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.8"/>
  <line x1="32" y1="32" x2="54" y2="23" stroke="#A855F7" stroke-width="1.2" stroke-opacity="0.8"/>
  <line x1="32" y1="32" x2="46" y2="48" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.8"/>
  <line x1="32" y1="32" x2="18" y2="48" stroke="#EC4899" stroke-width="1.2" stroke-opacity="0.8"/>
  <line x1="32" y1="32" x2="10" y2="23" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.8"/>

  <!-- Inter-Agent Cross Links -->
  <line x1="32" y1="8" x2="46" y2="48" stroke="#00E5FF" stroke-width="0.7" stroke-dasharray="2 2" stroke-opacity="0.3"/>
  <line x1="32" y1="8" x2="18" y2="48" stroke="#00E5FF" stroke-width="0.7" stroke-dasharray="2 2" stroke-opacity="0.3"/>
  <line x1="10" y1="23" x2="54" y2="23" stroke="#A855F7" stroke-width="0.7" stroke-dasharray="2 2" stroke-opacity="0.3"/>

  <!-- Peripheral Autonomous Agent Drones -->
  <!-- Agent 1: Synthesis Lead (Cyan) -->
  <circle cx="32" cy="8" r="4.5" fill="#0A0F1D" stroke="#00E5FF" stroke-width="1.8"/>
  <circle cx="32" cy="8" r="2" fill="#00E5FF"/>

  <!-- Agent 2: Reasoning Specialist (Violet) -->
  <circle cx="54" cy="23" r="4.5" fill="#0A0F1D" stroke="#A855F7" stroke-width="1.8"/>
  <circle cx="54" cy="23" r="2" fill="#A855F7"/>

  <!-- Agent 3: Critic & Verifier (Amber) -->
  <circle cx="46" cy="48" r="4.5" fill="#0A0F1D" stroke="#F59E0B" stroke-width="1.8"/>
  <circle cx="46" cy="48" r="2" fill="#F59E0B"/>

  <!-- Agent 4: Creative Lateral (Pink) -->
  <circle cx="18" cy="48" r="4.5" fill="#0A0F1D" stroke="#EC4899" stroke-width="1.8"/>
  <circle cx="18" cy="48" r="2" fill="#EC4899"/>

  <!-- Agent 5: Execution Core (Emerald) -->
  <circle cx="10" cy="23" r="4.5" fill="#0A0F1D" stroke="#34D399" stroke-width="1.8"/>
  <circle cx="10" cy="23" r="2" fill="#34D399"/>

  <!-- Central Swarm Overlord Core / Consensus Nexus -->
  <circle cx="32" cy="32" r="10" fill="url(#swarm-queen-glow)"/>
  <circle cx="32" cy="32" r="6" fill="#0A0F1D" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="2.8" fill="#FFFFFF"/>
</svg>
